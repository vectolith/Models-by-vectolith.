name: ASH PRIME controlled completion-budget study

on:
  workflow_dispatch:
    inputs:
      confirm_study:
        description: "Explicitly authorize the CPU completion study; this does not start training"
        required: true
        type: boolean
        default: false
      max_new_tokens:
        description: "Output budget for the separate controlled experiment"
        required: true
        type: choice
        options:
          - "512"
          - "768"
          - "1024"
        default: "512"

permissions:
  contents: read

jobs:
  completion-study:
    if: ${{ inputs.confirm_study == true }}
    name: Completion study / ${{ matrix.candidate }}
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - granite-3.1-3b-a800m
          - granite-4.2-3b
          - minicpm5-2b
          - lfm2.5-2.6b
          - phi-4-mini-instruct
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MAX_NEW_TOKENS: ${{ inputs.max_new_tokens }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install pinned CPU PyTorch
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run this candidate's full v1-v4 suite
        run: |
          python evaluation/run_completion_study.py \
            --candidate "${{ matrix.candidate }}" \
            --max-new-tokens "$MAX_NEW_TOKENS" \
            --suite evaluation/fixtures/prime_benchmark_v1.jsonl \
            --suite evaluation/fixtures/prime_qualification_v2.jsonl \
            --suite evaluation/fixtures/prime_qualification_v3.jsonl \
            --suite evaluation/fixtures/prime_qualification_v4.jsonl \
            --output-dir "artifacts/completion-study/${{ matrix.candidate }}" \
            --cache-dir "${{ runner.temp }}/hf-cache"
      - name: Preserve candidate results and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prime-controlled-completion-${{ matrix.candidate }}-${{ inputs.max_new_tokens }}
          path: artifacts/completion-study/${{ matrix.candidate }}/
          if-no-files-found: warn
          retention-days: 90
