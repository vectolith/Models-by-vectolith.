name: ASH PRIME Experiment 001 harness tests
on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/ash-prime/001/**"
      - ".github/workflows/ash-prime-experiment-tests.yml"
  push:
    branches: [main, "experiments/ash-prime-experiment-001"]
    paths:
      - "experiments/ash-prime/001/**"
      - ".github/workflows/ash-prime-experiment-tests.yml"
jobs:
  dependency-compatibility:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install free CPU PyTorch wheel
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
      - name: Install pinned baseline and training dependencies
        run: python -m pip install -r experiments/ash-prime/001/requirements-training.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Capture resolved CI package inventory and hash
        run: |
          mkdir -p evidence
          python -m pip freeze --all > evidence/dependency-inventory.txt
          sha256sum evidence/dependency-inventory.txt | tee evidence/dependency-inventory.sha256
          cat evidence/dependency-inventory.txt
      - name: Upload resolved dependency evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-inventory-${{ github.sha }}
          path: |
            evidence/dependency-inventory.txt
            evidence/dependency-inventory.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Verify runtime imports and exact direct versions
        run: |
          python - <<'PY'
          import torch, transformers, accelerate, safetensors, huggingface_hub, peft
          expected = {
              "torch": "2.8.0",
              "transformers": "4.57.1",
              "accelerate": "1.10.1",
              "safetensors": "0.6.2",
              "huggingface_hub": "0.36.0",
              "peft": "0.13.0",
          }
          actual = {
              "torch": torch.__version__.split("+")[0],
              "transformers": transformers.__version__,
              "accelerate": accelerate.__version__,
              "safetensors": safetensors.__version__,
              "huggingface_hub": huggingface_hub.__version__,
              "peft": peft.__version__,
          }
          if actual != expected:
              raise SystemExit(f"dependency version mismatch: {actual!r}")
          print(actual)
          PY
  unit-tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run deterministic validator tests
        run: python -m unittest discover -s experiments/ash-prime/001/tests -v
      - name: Validate example tasks
        run: python experiments/ash-prime/001/validate_tasks.py experiments/ash-prime/001/tasks.example.jsonl
      - name: Validate development dataset
        run: python experiments/ash-prime/001/validate_tasks.py experiments/ash-prime/001/tasks.dev.jsonl
      - name: Validate pending candidate record
        run: python experiments/ash-prime/001/validate_candidate.py experiments/ash-prime/001/candidate-qwen3-0.6b.json
