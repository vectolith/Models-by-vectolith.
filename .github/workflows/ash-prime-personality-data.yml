name: ASH PRIME personality data checks

on:
  pull_request:
    paths:
      - "data/personality/**"
      - "scripts/prepare_ash_prime_sft.py"
      - "scripts/validate_ash_prime_personality_data.py"
      - "scripts/validate_ash_prime_holdout.py"
      - "scripts/export_ash_prime_personality_train_data.py"
      - "scripts/tests/**"
      - "scripts/run_ash_prime_blind_eval.py"
      - "evaluation/personality/**"
      - ".github/workflows/ash-prime-personality-data.yml"
  push:
    branches: ["main"]
    paths:
      - "data/personality/**"
      - "scripts/prepare_ash_prime_sft.py"
      - "scripts/validate_ash_prime_personality_data.py"
      - "scripts/validate_ash_prime_holdout.py"
      - "scripts/export_ash_prime_personality_train_data.py"
      - "scripts/tests/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Validate draft dataset
        run: python scripts/validate_ash_prime_personality_data.py
      - name: Validate protected holdout split isolation
        run: python scripts/validate_ash_prime_holdout.py
      - name: Unit tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Smoke-check exporter
        run: |
          tmpdir="$(mktemp -d)"
          python scripts/export_ash_prime_personality_train_data.py --output "$tmpdir/export"
          python scripts/prepare_ash_prime_sft.py --output "$tmpdir/prepared"
          test -f "$tmpdir/prepared/sft-train.jsonl"
          test -f "$tmpdir/prepared/dpo-train.jsonl"
          test -f "$tmpdir/prepared/prepared-manifest.json"
          python scripts/run_ash_prime_blind_eval.py --output "$tmpdir/eval-smoke"
