name: Core Prime additional teacher snapshots and inference

on:
  pull_request:
    paths:
      - "evaluation/**"
      - ".github/workflows/core-prime-additional-teachers.yml"

permissions:
  contents: read

concurrency:
  group: core-prime-additional-teachers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  smollm3:
    name: SmolLM3-3B / snapshot + Prime contribution
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU inference stack
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.1 accelerate==1.10.1 safetensors==0.6.2 huggingface_hub==0.36.0
      - name: Resolve immutable revision and snapshot every file
        run: |
          python evaluation/snapshot_additional_teacher.py --candidate-id smollm3-3b --output artifacts/snapshots/smollm3-3b.json --cache-dir "${{ runner.temp }}/hf-cache"
      - name: Run real Prime v1-v4 inference
        run: |
          REVISION=$(python -c "import json; print(json.load(open('artifacts/snapshots/smollm3-3b.json'))['immutable_revision'])")
          python evaluation/probe_compute.py --output artifacts/compute/smollm3-3b-runner.json
          python evaluation/run_real_candidate_eval.py --repo HuggingFaceTB/SmolLM3-3B --revision "$REVISION" --family "HuggingFaceTB SmolLM3" --candidate-id smollm3-3b --suite evaluation/fixtures/prime_benchmark_v1.jsonl --suite evaluation/fixtures/prime_qualification_v2.jsonl --suite evaluation/fixtures/prime_qualification_v3.jsonl --suite evaluation/fixtures/prime_qualification_v4.jsonl --dtype bfloat16 --max-new-tokens 256 --cache-dir "${{ runner.temp }}/hf-cache" --output artifacts/evaluations/smollm3-3b-core_prime.json 2>&1 | tee artifacts/evaluations/smollm3-3b-core_prime.log
      - name: Preserve snapshot, raw outputs and resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime-teacher-smollm3-3b
          path: |
            artifacts/snapshots/smollm3-3b.json
            artifacts/compute/smollm3-3b-runner.json
            artifacts/evaluations/smollm3-3b-core_prime.json
            artifacts/evaluations/smollm3-3b-core_prime.jsonl
            artifacts/evaluations/smollm3-3b-core_prime.log
          if-no-files-found: warn
          retention-days: 90

  lfm25:
    name: LFM2.5-2.6B / snapshot + Prime contribution
    needs: smollm3
    if: ${{ always() && needs.smollm3.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU inference stack
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.0.0 accelerate==1.10.1 safetensors==0.6.2 huggingface_hub==0.36.0
      - name: Resolve immutable revision and snapshot every file
        run: |
          python evaluation/snapshot_additional_teacher.py --candidate-id lfm2.5-2.6b --output artifacts/snapshots/lfm2.5-2.6b.json --cache-dir "${{ runner.temp }}/hf-cache"
      - name: Run real Prime v1-v4 inference
        run: |
          REVISION=$(python -c "import json; print(json.load(open('artifacts/snapshots/lfm2.5-2.6b.json'))['immutable_revision'])")
          python evaluation/probe_compute.py --output artifacts/compute/lfm2.5-2.6b-runner.json
          python evaluation/run_real_candidate_eval.py --repo LiquidAI/LFM2.5-2.6B --revision "$REVISION" --family "LiquidAI LFM2.5" --candidate-id lfm2.5-2.6b --suite evaluation/fixtures/prime_benchmark_v1.jsonl --suite evaluation/fixtures/prime_qualification_v2.jsonl --suite evaluation/fixtures/prime_qualification_v3.jsonl --suite evaluation/fixtures/prime_qualification_v4.jsonl --dtype bfloat16 --max-new-tokens 256 --cache-dir "${{ runner.temp }}/hf-cache" --output artifacts/evaluations/lfm2.5-2.6b-core_prime.json 2>&1 | tee artifacts/evaluations/lfm2.5-2.6b-core_prime.log
      - name: Preserve snapshot, raw outputs and resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime-teacher-lfm2.5-2.6b
          path: |
            artifacts/snapshots/lfm2.5-2.6b.json
            artifacts/compute/lfm2.5-2.6b-runner.json
            artifacts/evaluations/lfm2.5-2.6b-core_prime.json
            artifacts/evaluations/lfm2.5-2.6b-core_prime.jsonl
            artifacts/evaluations/lfm2.5-2.6b-core_prime.log
          if-no-files-found: warn
          retention-days: 90

  phi4mini:
    name: Phi-4-mini-instruct / snapshot + Prime contribution
    needs: lfm25
    if: ${{ always() && needs.lfm25.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU inference stack
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.1 accelerate==1.10.1 safetensors==0.6.2 huggingface_hub==0.36.0
      - name: Resolve immutable revision and snapshot every file
        run: |
          python evaluation/snapshot_additional_teacher.py --candidate-id phi-4-mini-instruct --output artifacts/snapshots/phi-4-mini-instruct.json --cache-dir "${{ runner.temp }}/hf-cache"
      - name: Run real Prime v1-v4 inference without executing repository remote code
        run: |
          REVISION=$(python -c "import json; print(json.load(open('artifacts/snapshots/phi-4-mini-instruct.json'))['immutable_revision'])")
          python evaluation/probe_compute.py --output artifacts/compute/phi-4-mini-instruct-runner.json
          python evaluation/run_real_candidate_eval.py --repo microsoft/Phi-4-mini-instruct --revision "$REVISION" --family "Microsoft Phi-4" --candidate-id phi-4-mini-instruct --suite evaluation/fixtures/prime_benchmark_v1.jsonl --suite evaluation/fixtures/prime_qualification_v2.jsonl --suite evaluation/fixtures/prime_qualification_v3.jsonl --suite evaluation/fixtures/prime_qualification_v4.jsonl --dtype bfloat16 --max-new-tokens 256 --cache-dir "${{ runner.temp }}/hf-cache" --output artifacts/evaluations/phi-4-mini-instruct-core_prime.json 2>&1 | tee artifacts/evaluations/phi-4-mini-instruct-core_prime.log
      - name: Preserve snapshot, raw outputs and resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime-teacher-phi-4-mini-instruct
          path: |
            artifacts/snapshots/phi-4-mini-instruct.json
            artifacts/compute/phi-4-mini-instruct-runner.json
            artifacts/evaluations/phi-4-mini-instruct-core_prime.json
            artifacts/evaluations/phi-4-mini-instruct-core_prime.jsonl
            artifacts/evaluations/phi-4-mini-instruct-core_prime.log
          if-no-files-found: warn
          retention-days: 90
