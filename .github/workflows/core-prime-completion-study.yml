name: Core Prime controlled completion-budget study

on:
  workflow_dispatch:
    inputs:
      confirm_study:
        description: "Explicitly authorize the CPU completion study; this does not start training"
        required: true
        type: boolean
        default: false
      max_new_tokens:
        description: "Output budget for the separate controlled experiment"
        required: true
        type: choice
        options:
          - "512"
          - "768"
          - "1024"
        default: "512"

permissions:
  contents: read

jobs:
  completion-study:
    if: ${{ inputs.confirm_study == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MAX_NEW_TOKENS: ${{ inputs.max_new_tokens }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU PyTorch
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run all five candidates sequentially on the same runner
        run: |
          python evaluation/run_completion_study.py \
            --max-new-tokens "$MAX_NEW_TOKENS" \
            --suite evaluation/fixtures/prime_benchmark_v1.jsonl \
            --suite evaluation/fixtures/prime_qualification_v2.jsonl \
            --suite evaluation/fixtures/prime_qualification_v3.jsonl \
            --suite evaluation/fixtures/prime_qualification_v4.jsonl \
            --output-dir artifacts/completion-study \
            --cache-dir "${{ runner.temp }}/hf-cache"
      - name: Preserve every candidate result and failure record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime-controlled-completion-study-${{ inputs.max_new_tokens }}
          path: artifacts/completion-study/
          if-no-files-found: warn
          retention-days: 90
