name: Expanded Prime and Prima qualification inference

on:
  pull_request:
    paths:
      - "evaluation/**"
      - ".github/workflows/expanded-qualification-inference.yml"
  push:
    branches: [main]
    paths:
      - "evaluation/**"
      - ".github/workflows/expanded-qualification-inference.yml"

permissions:
  contents: read

jobs:
  expanded-inference:
    name: ${{ matrix.candidate_id }} / ${{ matrix.role }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - candidate_id: granite-3.1-3b-a800m
            repo: ibm-granite/granite-3.1-3b-a800m-instruct
            family: IBM Granite
            revision: a02780686e08a03fe0d2679a293b5c74a90efa89
            role: core_prime
            suite_a: evaluation/fixtures/prime_benchmark_v1.jsonl
            suite_b: evaluation/fixtures/prime_qualification_v2.jsonl
            suite_c: evaluation/fixtures/prime_qualification_v3.jsonl
          - candidate_id: granite-4.2-3b
            repo: ibm-granite/granite-4.2-3b
            family: IBM Granite
            revision: 4e9c275e232f10211ec88644d106a1f6a1b60e06
            transformers_version: 5.0.0
            role: core_prime
            suite_a: evaluation/fixtures/prime_benchmark_v1.jsonl
            suite_b: evaluation/fixtures/prime_qualification_v2.jsonl
            suite_c: evaluation/fixtures/prime_qualification_v3.jsonl
          - candidate_id: minicpm5-2b
            repo: openbmb/MiniCPM5-2B
            family: OpenBMB MiniCPM
            revision: 42433e90dad95123ab87729fd7011e7110629556
            transformers_version: 4.57.1
            role: core_prime
            suite_a: evaluation/fixtures/prime_benchmark_v1.jsonl
            suite_b: evaluation/fixtures/prime_qualification_v2.jsonl
            suite_c: evaluation/fixtures/prime_qualification_v3.jsonl
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU inference dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==${{ matrix.transformers_version || '4.57.1' }}" accelerate==1.10.1 safetensors==0.6.2 huggingface_hub==0.36.0
      - name: Record actual runner resources
        run: python evaluation/probe_compute.py --output artifacts/compute/runner.json
      - name: Run all public competency cases against the pinned checkpoint
        run: |
          mkdir -p artifacts/evaluations
          set -o pipefail
          python evaluation/run_real_candidate_eval.py \
            --repo "${{ matrix.repo }}" \
            --revision "${{ matrix.revision }}" \
            --family "${{ matrix.family }}" \
            --candidate-id "${{ matrix.candidate_id }}" \
            --suite "${{ matrix.suite_a }}" \
            --suite "${{ matrix.suite_b }}" \
            --suite "${{ matrix.suite_c }}" \
            --dtype bfloat16 \
            --max-new-tokens 256 \
            --cache-dir "${{ runner.temp }}/hf-cache" \
            --output "artifacts/evaluations/${{ matrix.candidate_id }}-${{ matrix.role }}.json" \
            2>&1 | tee "artifacts/evaluations/${{ matrix.candidate_id }}-${{ matrix.role }}.log"
      - name: Preserve raw per-case outputs and resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-${{ matrix.candidate_id }}-${{ matrix.role }}
          path: |
            artifacts/evaluations/${{ matrix.candidate_id }}-${{ matrix.role }}.json
            artifacts/evaluations/${{ matrix.candidate_id }}-${{ matrix.role }}.jsonl
            artifacts/evaluations/${{ matrix.candidate_id }}-${{ matrix.role }}.log
            artifacts/compute/runner.json
          if-no-files-found: warn
          retention-days: 90
