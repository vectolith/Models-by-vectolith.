name: Kaggle kernel CPU tests
on:
  pull_request:
    branches: [main]
    paths:
      - "training/**"
      - ".github/workflows/kaggle-kernel-tests.yml"
  push:
    branches: [main]
    paths:
      - "training/**"
      - ".github/workflows/kaggle-kernel-tests.yml"
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Compile kernel and corpus builder
        run: >-
          python -m py_compile training/kaggle/kernel.py
          training/kaggle/test_kernel_cpu.py training/build_run42_corpus.py
      - name: Run kernel CPU tests
        run: python -m unittest training/kaggle/test_kernel_cpu.py -v
      - name: Run graded corpus builder tests
        run: python -m unittest training.tests.test_build_run42_corpus -v
