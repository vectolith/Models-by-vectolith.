name: Model capability registry tests
on:
  pull_request:
    branches: [main]
    paths:
      - "models/**"
      - ".github/workflows/model-capability-registry.yml"
  push:
    branches: [main, "models/variant-capability-registry"]
    paths:
      - "models/**"
      - ".github/workflows/model-capability-registry.yml"
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Run registry tests
        run: python -m unittest discover -s models/runtime/tests -v
