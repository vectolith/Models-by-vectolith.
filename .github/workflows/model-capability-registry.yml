name: Model capability registry tests
on:
  pull_request:
    branches: [main]
    paths:
      - "models/**"
      - ".github/workflows/model-capability-registry.yml"
  push:
    branches: [main, "models/variant-capability-registry"]
    paths:
      - "models/**"
      - ".github/workflows/model-capability-registry.yml"
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run registry tests
        run: python -m unittest discover -s models/runtime/tests -v
