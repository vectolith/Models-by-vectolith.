name: Core Prime runtime and evaluation tests

on:
  pull_request:
    paths:
      - "runtime/**"
      - "evaluation/**"
      - ".github/workflows/runtime-and-evaluation.yml"
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "evaluation/**"
      - ".github/workflows/runtime-and-evaluation.yml"

concurrency:
  group: core-prime-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime package
        run: python -m pip install -e ./runtime
      - name: Run runtime tests
        run: python -m unittest discover -s runtime/tests -v
      - name: Run foundation evaluation tests
        run: python -m unittest discover -s evaluation/tests -v
