name: Runtime and evaluation tests

on:
  pull_request:
    paths:
      - "runtime/**"
      - "evaluation/**"
      - ".github/workflows/runtime-and-evaluation.yml"
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "evaluation/**"
      - ".github/workflows/runtime-and-evaluation.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime package
        run: python -m pip install -e ./runtime
      - name: Run runtime tests
        run: python -m unittest discover -s runtime/tests -v
      - name: Run foundation evaluation and live Hugging Face integration tests
        env:
          VECTOLITH_RUN_LIVE_TESTS: "1"
        run: python -m unittest discover -s evaluation/tests -v
      - name: Discover real model candidates across teacher families
        run: |
          python evaluation/discover_hf_candidates.py \
            --search "Qwen3" \
            --search "Granite" \
            --search "Gemma" \
            --search "Ministral" \
            --search "Ministral" \
            --author "Qwen" \
            --author "ibm-granite" \
            --author "google" \
            --author "mistralai" \
            --author "ministral" \
            --limit 5 \
            --sort downloads \
            --output artifacts/candidates/huggingface-discovery.jsonl
      - name: Preserve live discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: huggingface-candidate-discovery
          path: artifacts/candidates/huggingface-discovery.jsonl
          if-no-files-found: error
          retention-days: 30

  real-sequential-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU inference dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.1 accelerate==1.10.1 safetensors==0.6.2 huggingface_hub==0.36.0
      - name: Capture actual runner hardware and accelerator availability
        run: python evaluation/probe_compute.py --output artifacts/compute/sequential-runner.json
      - name: Run all pinned candidates sequentially on the same CPU runner
        run: |
          python evaluation/run_real_candidate_matrix.py \
            --manifest evaluation/fixtures/real_cpu_candidates_v1.json \
            --suite evaluation/fixtures/prime_smoke.jsonl \
            --suite evaluation/fixtures/prima_smoke.jsonl \
            --dtype bfloat16 \
            --max-new-tokens 64 \
            --cache-dir "${{ runner.temp }}/hf-cache" \
            --output-dir artifacts/evaluations/sequential \
            --summary-output artifacts/evaluations/sequential/summary.json
      - name: Preserve same-runner candidate outputs and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-sequential-candidate-comparison
          path: artifacts/evaluations/sequential/
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve same-runner compute evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sequential-runner-compute-observation
          path: artifacts/compute/sequential-runner.json
          if-no-files-found: ignore
          retention-days: 30
