name: Runtime and evaluation tests

on:
  pull_request:
    paths:
      - "runtime/**"
      - "evaluation/**"
      - ".github/workflows/runtime-and-evaluation.yml"
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "evaluation/**"
      - ".github/workflows/runtime-and-evaluation.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime package
        run: python -m pip install -e ./runtime
      - name: Run runtime tests
        run: python -m unittest discover -s runtime/tests -v
      - name: Run foundation evaluation and live Hugging Face integration tests
        env:
          VECTOLITH_RUN_LIVE_TESTS: "1"
        run: python -m unittest discover -s evaluation/tests -v
      - name: Discover real model candidates across teacher families
        run: |
          python evaluation/discover_hf_candidates.py \
            --search "Qwen3" \
            --search "Granite" \
            --search "Gemma" \
            --search "Ministral" \
            --search "Ministral" \
            --author "Qwen" \
            --author "ibm-granite" \
            --author "google" \
            --author "mistralai" \
            --author "ministral" \
            --limit 5 \
            --sort downloads \
            --output artifacts/candidates/huggingface-discovery.jsonl
      - name: Preserve live discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: huggingface-candidate-discovery
          path: artifacts/candidates/huggingface-discovery.jsonl
          if-no-files-found: error
          retention-days: 30

  real-checkpoint-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU inference dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.1 accelerate==1.10.1 safetensors==0.6.2
      - name: Run Prime and Prima smoke suites against pinned Qwen3 checkpoint
        run: |
          python evaluation/run_real_checkpoint_suite.py \
            --suite evaluation/fixtures/prime_smoke.jsonl \
            --suite evaluation/fixtures/prima_smoke.jsonl \
            --max-new-tokens 64
      - name: Preserve real checkpoint evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-0.6b-real-suite
          path: artifacts/evaluations/qwen3-0.6b-smoke-suites.json
          if-no-files-found: error
          retention-days: 30
