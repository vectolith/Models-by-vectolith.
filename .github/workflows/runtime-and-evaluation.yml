name: Runtime and evaluation tests

on:
  pull_request:
    paths:
      - "runtime/**"
      - "evaluation/**"
      - ".github/workflows/runtime-and-evaluation.yml"
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "evaluation/**"
      - ".github/workflows/runtime-and-evaluation.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime package
        run: python -m pip install -e ./runtime
      - name: Run runtime tests
        run: python -m unittest discover -s runtime/tests -v
      - name: Run foundation evaluation and live Hugging Face integration tests
        env:
          VECTOLITH_RUN_LIVE_TESTS: "1"
        run: python -m unittest discover -s evaluation/tests -v
      - name: Discover real model candidates across teacher families
        run: |
          python evaluation/discover_hf_candidates.py \
            --search "Qwen3" \
            --search "Granite" \
            --search "Gemma" \
            --search "Ministral" \
            --limit 3 \
            --sort downloads \
            --output artifacts/candidates/huggingface-discovery.jsonl
      - name: Preserve live discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: huggingface-candidate-discovery
          path: artifacts/candidates/huggingface-discovery.jsonl
          if-no-files-found: error
          retention-days: 30
