name: Toy LoRA Swift validation

on:
  pull_request:
    paths:
      - "experiments/mobile-training/toy-lora/**"
      - ".github/workflows/toy-lora-swift.yml"
  push:
    branches:
      - main
    paths:
      - "experiments/mobile-training/toy-lora/**"
      - ".github/workflows/toy-lora-swift.yml"

permissions:
  contents: read

jobs:
  swift-package:
    runs-on: ubuntu-latest
    container:
      image: swift:6.2
    defaults:
      run:
        working-directory: experiments/mobile-training/toy-lora
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show Swift version
        run: swift --version
      - name: Run package tests
        run: swift test
      - name: Execute toy training demonstration
        run: swift run ToyLoRA
