[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vectolith-runtime"
version = "0.1.0"
description = "Model-neutral task orchestration and delegated execution runtime for Models by vectolith"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["."]
include = ["vectolith_runtime*"]
