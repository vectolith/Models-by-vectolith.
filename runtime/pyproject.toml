[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vectolith-runtime"
version = "0.1.0"
description = "Model-neutral task orchestration and delegated execution runtime for Models by vectolith"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
vectolith-runtime = "vectolith_runtime.cli:main"

[project.optional-dependencies]
training = ["torch>=2.4", "transformers>=4.45", "datasets>=3.0", "peft>=0.13", "accelerate>=1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vectolith_runtime*"]

[tool.setuptools.package-data]
vectolith_runtime = ["schemas/*.json"]
